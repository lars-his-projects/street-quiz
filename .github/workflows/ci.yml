name: CI

# Quick checks on each PR and on main: Automerge merges a green agent PR (workflow name "CI", job "quick").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt
      - run: npm ci
      - name: Lint
        run: ruff check . && npx @biomejs/biome check .
      - name: Fast tests
        run: python3 -m pytest -q && npx vitest run
      - name: Build
        run: npm run build

  # The browser test (#14): the built app at a phone and a computer size, with no request to an outside host (P3).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
