# The owner's settings of the agent system (framework/tools/agent_config.py joins them with agent.toml).

[pacing]
max_runs = 4                    # the most runs at one time (framework/tools/usage.py)
max_waiting_prs = 10            # flow brake: at this many old agent PRs the pacer starts only 1 repair run
max_ci_queue = 5                # flow brake: at this many queued CI runs the pacer starts no run
week_guard = false              # true: the 7-day usage limits the runs; false: only the 5-hour window counts. It is false to
                                # start the project (owner, 2026-11-14): the PR that sets `area:name` to [x] in the roadmap sets
                                # it back to true, as in the other projects (CLAUDE.md, "Rules of the domain")
week_free = 0.0                 # 0: the weekly pace counts from the start of the week (framework/tools/usage.py)
week_share = 0.27               # the part of the weekly budget of the account that this project plans with: the hub sets it
                                # from the weight of the project in its registry; 1: the project has the account alone
week_reserve = 0.10             # the part of the week that the runs leave to the sessions of the owner, until 12 hours before the weekly reset
weights = { haiku = 0.25, sonnet = 0.5, fable = 2.5 }   # a lane run in Opus runs: Haiku is measured; Sonnet and Fable are start values from the list prices (2026-11-14)
reserved = ["haiku", "sonnet", "fable"]    # lanes whose tickets the Opus runs never take. The name of a lane is its model (owner, 2026-11-14)
duty = "opus"                   # the lane of the epic check, the queue refill and the reviews. `opus` is the default lane (no lane label);
                                # a reserved lane here (`fable`) gives this work to the runs of that lane only
pacer = "workflow"              # pacer.yml plans the runs each 10 minutes (framework/tools/pacer.py); another value stops its loop
starts = "session"              # the starter session of the hub starts the planned runs (its docs/STARTER.md): the project
                                # needs no scheduled task and no secret; with no `starts` line, pacer.yml starts them with API triggers
trigger = ""                    # with API triggers only: the ID of the scheduled task "NAME autopilot" (framework/docs/OPERATOR.md, section 3)

[review]                        # the process review (`improve` skill): merged PRs, never hours
gap = 80                        # merged PRs: the first gap, and the reset when the result of the reviews turns
min_gap = 10                    # a review with a change halves a gap up to `gap`, down to this
max_gap = 640                   # a review with no change doubles a gap from `gap` up, up to this
owner_gap = 20                  # the gap when an owner session merged a PR since the last review
